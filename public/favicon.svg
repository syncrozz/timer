<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c103c" />
      <stop offset="100%" stop-color="#060416" />
    </radialGradient>
    <linearGradient id="purpleRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Circle Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" />

  <!-- Top Timer Crown/Knob -->
  <rect x="220" y="48" width="72" height="22" rx="11" fill="url(#purpleRing)" />
  <rect x="238" y="66" width="36" height="18" rx="4" fill="url(#purpleRing)" />

  <!-- Outer Purple Ring -->
  <circle cx="256" cy="268" r="192" fill="none" stroke="url(#purpleRing)" stroke-width="22" />

  <!-- Inner Play Button Badge Circle -->
  <circle cx="256" cy="188" r="48" fill="none" stroke="url(#purpleRing)" stroke-width="10" />
  <!-- Play Triangle inside Badge -->
  <path d="M 244,170 L 276,188 L 244,206 Z" fill="url(#playGrad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- ONE TAP Text -->
  <text x="256" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ONE TAP</text>
</svg>
